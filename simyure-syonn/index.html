<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="public/assets/svg+xml" href="/favicon.svg" /> -->
     <link rel="icon" type="public/assets/ico" href="/Earth_Favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="haiti.css"> 
    <title>simyure-syonn</title>
  </head>
  <body>
    <img id="bcscreen" src="/assets/cosmo_bc.svg">
    <div id="home" class="screen">
      <div id=menu_bar class="hidden">
        <button id=fight class="menu">fight!</button> 
        <div id="fight_list" class="hidden">
          <input id="fighter1" placeholder="戦わせる世界のナンバーを半角で入力(｀・ω・´)">  <!--kari　jsで変更するようにする  今機能なし-->
          <input id="fighter2" placeholder="戦わせる世界のナンバーを半角で入力(｀・ω・´)">
          <button>決定!</button>
        </div>
      </div>
      <div id="Worlds"></div>

      <button id="createWorld_button">作成</button>

    </div>

    <div id="game" class="screen hidden">
      <div class="screen main">

        <div id="normal_view">
          <div id="normal_center">
            <button class="reset">reset</button>
            <div id="lvup_div"></div>
            <p class="status"></p>
          </div>
          <!-- <div class="K_img">
            王の王国エンブレム
            <img class="K_popl" src="/assets/K_popl.svg">
            <img class="K_mil" src="/assets/K_mil.svg">
            <img class="K_boss" src="/assets/K_boss.svg"> svgお試し
          </div> -->
        </div>

        <div id="boss_view">
          <p id="boss_name_lbl"></p>
          <div id="hpbar_outer">
            <div id="hpbar_inner"></div>
          </div>
          <div id="battle_stage">
            <img id="battle_earth_img" class="battle_img" alt="earth">
            <img id="battle_boss_img" class="battle_img" alt="boss">
          </div>
          <p class="status"></p>
        </div>

      </div>

      <aside class="screen sub">
        <button id="game_logbutton"><img src="/assets/menu_img.png"></button>
        <div id="game_loglist" class="hidden"></div>
      </aside>

      <!-- ポップアップ層：mainの外・gameの直下に置く -->
      <div id="event_selector" class="screen"></div>
    </div>

    <div id="disp_result" class="screen hidden"></div>

    <script type="module" src="script_for_fes.js" defer></script>
  </body>
</html>
